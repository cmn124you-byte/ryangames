<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 18% 22%, #1e1b4b 0%, #0f172a 58%, #08111f 100%);
    position: relative; color: #fff;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .o1 { width: 900px; height: 900px; background: #e11d48; top: -260px; left: -200px; opacity: .5; }
  .o2 { width: 800px; height: 800px; background: #7c3aed; bottom: -280px; right: -180px; opacity: .5; }
  .o3 { width: 500px; height: 500px; background: #f59e0b; top: 120px; right: 420px; opacity: .28; }
  .o4 { width: 460px; height: 460px; background: #16a34a; top: 1080px; left: 240px; opacity: .2; }
  .spark { position: absolute; font-size: 80px; opacity: .5; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .12; transform: scale(.85);} 50% { opacity: .6; transform: scale(1.12);} }
  /* safe area: 1546x423 centered */
  .safe {
    position: absolute; top: 508px; left: 50%; transform: translateX(-50%);
    width: 1546px; height: 423px;
    display: flex; align-items: center; justify-content: center; gap: 56px;
  }
  .textbox { text-align: right; }
  .badge {
    display: inline-block; font-size: 40px; font-weight: 900;
    background: linear-gradient(90deg,#16a34a,#65a30d); color: #fff;
    padding: 10px 40px; border-radius: 999px; border: 4px solid #fde047;
    box-shadow: 0 10px 26px rgba(22,163,74,.45); margin-bottom: 18px;
  }
  .title {
    font-size: 138px; font-weight: 900; line-height: 1.02;
    background: linear-gradient(180deg,#fde047 10%,#f59e0b 55%,#e11d48 125%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,.55));
  }
  .sub { font-size: 52px; font-weight: 800; color: #fff; margin-top: 12px; text-shadow: 0 5px 14px rgba(0,0,0,.6); }
  .games { display: flex; gap: 30px; font-size: 92px; }
  .games span { display: inline-block; animation: bounce 2.4s ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  .games span:nth-child(2){animation-delay:.2s}.games span:nth-child(3){animation-delay:.4s}
  .games span:nth-child(4){animation-delay:.6s}.games span:nth-child(5){animation-delay:.8s}
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-16px);} }
</style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="orb o4"></div>
  <span class="spark" style="top:140px;right:220px;">✦</span>
  <span class="spark" style="top:240px;left:180px;animation-delay:.6s">✦</span>
  <span class="spark" style="bottom:220px;right:340px;animation-delay:1.2s">✨</span>
  <span class="spark" style="bottom:140px;left:420px;animation-delay:1.8s">✦</span>

  <div class="safe">
    <div class="textbox">
      <span class="badge">🎮 قناة الألعاب العربية</span>
      <div class="title">ريان ألعاب</div>
      <div class="sub">تحميل ألعاب معرّبة مجانًا · ألعاب بلا نت · لوحة شرف عالمية</div>
    </div>
    <div class="games"><span>🎣</span><span>🏃</span><span>⚔️</span><span>✨</span><span>🎯</span></div>
  </div>
</body>
</html>
