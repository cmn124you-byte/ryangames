<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 800px; overflow: hidden; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 30% 25%, #1e1b4b 0%, #0f172a 65%, #08111f 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .ring { position: relative; width: 640px; height: 640px; border-radius: 50%; background: linear-gradient(135deg,#fde047 0%,#f59e0b 35%,#e11d48 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 70px rgba(0,0,0,.6); }
  .ring::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #1e1b4b 0%, #0f172a 70%, #08111f 100%); }
  .inner { position: relative; z-index: 2; text-align: center; color: #fff; }
  .emoji { font-size: 200px; filter: drop-shadow(0 12px 20px rgba(0,0,0,.55)); animation: bounce 2.4s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-14px);} }
  .name { font-size: 88px; font-weight: 900; margin-top: 10px; background: linear-gradient(180deg,#fde047 10%,#f59e0b 60%,#e11d48 130%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 34px; font-weight: 800; color: #e2e8f0; margin-top: 6px; }
</style>
</head>
<body>
  <div class="ring">
    <div class="inner">
      <div class="emoji">🎮</div>
      <div class="name">ريان ألعاب</div>
      <div class="tag">ألعاب معرّبة مجانًا</div>
    </div>
  </div>
</body>
</html>
