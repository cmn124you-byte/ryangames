name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        working-directory: mobile
        run: |
          npm install
          npm install -g @capacitor/cli@6

      - name: Sync web assets into Android project
        working-directory: mobile
        run: npx cap add android && npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Sign release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
            ./gradlew signReleaseBundle
            rm -f release.jks
          else
            echo "No keystore secret set — building unsigned APK only."
          fi

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find mobile/android -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyanGames-Android
          path: artifacts/*.apk
